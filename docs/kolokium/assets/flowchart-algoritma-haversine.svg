<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1540" viewBox="0 0 1240 1540">
  <rect width="1240" height="1540" fill="#ffffff"/>

  <defs>
    <marker id="arrow" markerWidth="11" markerHeight="11" refX="9" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,8 L10,4 z" fill="#111111"/>
    </marker>
    <style>
      text{font-family:"Times New Roman", Times, serif}
      .shapeText{font-size:18px;font-weight:700;fill:#111111;text-anchor:middle;dominant-baseline:middle}
      .smallText{font-size:16px;fill:#111111;text-anchor:middle;dominant-baseline:middle}
      .formulaText{font-size:15px;fill:#111111;text-anchor:middle;dominant-baseline:middle}
      .label{font-size:16px;font-style:italic;fill:#111111;text-anchor:middle}
      .startEnd{fill:#ffffff;stroke:#111111;stroke-width:2.6}
      .process{fill:#ffffff;stroke:#111111;stroke-width:2.6}
      .io{fill:#ffffff;stroke:#111111;stroke-width:2.6}
      .decision{fill:#ffffff;stroke:#111111;stroke-width:2.6}
      .calc{fill:#ffffff;stroke:#111111;stroke-width:2.6}
      .line{stroke:#111111;stroke-width:2.6;fill:none;marker-end:url(#arrow)}
      .thin{stroke:#111111;stroke-width:1.8;fill:none}
    </style>
  </defs>

  <g transform="translate(0,-80)">
  <ellipse cx="620" cy="145" rx="82" ry="30" class="startEnd"/>
  <text x="620" y="146" class="shapeText">Mulai</text>

  <polygon points="395,210 880,210 835,275 350,275" class="io"/>
  <text x="615" y="233" class="shapeText">Input koordinat jemaah dan daftar petugas</text>
  <text x="615" y="255" class="smallText">lat1, lon1, lat2, lon2</text>

  <rect x="490" y="335" width="260" height="58" rx="7" class="process"/>
  <text x="620" y="358" class="shapeText">Ambil satu data</text>
  <text x="620" y="380" class="shapeText">petugas</text>

  <polygon points="620,455 745,515 620,575 495,515" class="decision"/>
  <text x="620" y="507" class="shapeText">Koordinat</text>
  <text x="620" y="530" class="shapeText">valid?</text>

  <rect x="140" y="487" width="245" height="58" rx="7" class="process"/>
  <text x="263" y="510" class="shapeText">Lewati data</text>
  <text x="263" y="532" class="shapeText">petugas</text>

  <rect x="370" y="640" width="500" height="205" rx="8" class="calc"/>
  <text x="620" y="670" class="shapeText">Proses Perhitungan Haversine</text>
  <line x1="400" y1="695" x2="840" y2="695" class="thin"/>
  <text x="620" y="724" class="formulaText">1. Konversi koordinat dari derajat ke radian</text>
  <text x="620" y="756" class="formulaText">2. Hitung Delta lat = lat2 - lat1 dan Delta lon = lon2 - lon1</text>
  <text x="620" y="788" class="formulaText">3. Hitung a = sin²(Delta lat/2) + cos(lat1) x cos(lat2) x sin²(Delta lon/2)</text>
  <text x="620" y="820" class="formulaText">4. Batasi nilai a pada rentang 0 sampai 1, lalu hitung d = 2r x asin(akar a)</text>

  <rect x="490" y="910" width="260" height="58" rx="7" class="process"/>
  <text x="620" y="933" class="shapeText">Simpan jarak</text>
  <text x="620" y="955" class="shapeText">petugas</text>

  <polygon points="620,1030 750,1090 620,1150 490,1090" class="decision"/>
  <text x="620" y="1082" class="shapeText">Masih ada</text>
  <text x="620" y="1105" class="shapeText">petugas?</text>

  <rect x="860" y="1060" width="245" height="58" rx="7" class="process"/>
  <text x="983" y="1083" class="shapeText">Ambil petugas</text>
  <text x="983" y="1105" class="shapeText">berikutnya</text>

  <rect x="490" y="1215" width="260" height="58" rx="7" class="process"/>
  <text x="620" y="1238" class="shapeText">Urutkan jarak</text>
  <text x="620" y="1260" class="shapeText">dari terkecil</text>

  <polygon points="425,1340 815,1340 775,1405 465,1405" class="io"/>
  <text x="620" y="1364" class="shapeText">Output ranking</text>
  <text x="620" y="1387" class="shapeText">petugas terdekat</text>

  <ellipse cx="620" cy="1480" rx="82" ry="30" class="startEnd"/>
  <text x="620" y="1481" class="shapeText">Selesai</text>

  <path d="M620 175 L620 210" class="line"/>
  <path d="M620 275 L620 335" class="line"/>
  <path d="M620 393 L620 455" class="line"/>
  <path d="M495 515 L385 515" class="line"/>
  <text x="440" y="498" class="label">Tidak</text>
  <path d="M620 575 L620 640" class="line"/>
  <text x="645" y="608" class="label">Ya</text>
  <path d="M620 845 L620 910" class="line"/>
  <path d="M620 968 L620 1030" class="line"/>
  <path d="M750 1090 L860 1090" class="line"/>
  <text x="805" y="1073" class="label">Ya</text>
  <path d="M983 1060 L983 364 L750 364" class="line"/>
  <path d="M263 545 L263 1090 L490 1090" class="line"/>
  <path d="M620 1150 L620 1215" class="line"/>
  <text x="645" y="1182" class="label">Tidak</text>
  <path d="M620 1273 L620 1340" class="line"/>
  <path d="M620 1405 L620 1450" class="line"/>
  </g>
</svg>

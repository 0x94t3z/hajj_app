<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540">
  <rect width="960" height="540" fill="#f7faf9"/>
  <text x="48" y="58" font-family="Arial, sans-serif" font-size="32" font-weight="700" fill="#17313b">Ilustrasi Haversine Formula</text>
  <text x="48" y="92" font-family="Arial, sans-serif" font-size="18" fill="#5d6b73">Jarak awal antarkoordinat jemaah dan petugas pada permukaan bumi</text>

  <circle cx="295" cy="290" r="155" fill="#e7f0f1" stroke="#17313b" stroke-width="4"/>
  <path d="M155 290 C205 190, 385 185, 435 290" fill="none" stroke="#2d8c98" stroke-width="5" stroke-linecap="round"/>
  <path d="M155 290 C205 390, 385 395, 435 290" fill="none" stroke="#c99528" stroke-width="3" stroke-dasharray="8 10"/>
  <line x1="295" y1="135" x2="295" y2="445" stroke="#9fb1b7" stroke-width="2" stroke-dasharray="6 8"/>
  <line x1="140" y1="290" x2="450" y2="290" stroke="#9fb1b7" stroke-width="2" stroke-dasharray="6 8"/>

  <circle cx="188" cy="245" r="12" fill="#2d8c98"/>
  <circle cx="405" cy="318" r="12" fill="#c54f4a"/>
  <text x="126" y="224" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#17313b">Jemaah</text>
  <text x="382" y="350" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#17313b">Petugas</text>
  <text x="220" y="184" font-family="Arial, sans-serif" font-size="18" fill="#2d8c98">d = jarak Haversine</text>

  <rect x="540" y="135" width="360" height="275" rx="16" fill="#ffffff" stroke="#d8e4e4" stroke-width="3"/>
  <text x="570" y="180" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#17313b">Keterangan Koordinat</text>
  <text x="570" y="225" font-family="Arial, sans-serif" font-size="19" fill="#17313b">lat1, lon1 = koordinat jemaah</text>
  <text x="570" y="260" font-family="Arial, sans-serif" font-size="19" fill="#17313b">lat2, lon2 = koordinat petugas</text>
  <text x="570" y="295" font-family="Arial, sans-serif" font-size="19" fill="#17313b">Delta lat = lat2 - lat1</text>
  <text x="570" y="330" font-family="Arial, sans-serif" font-size="19" fill="#17313b">Delta lon = lon2 - lon1</text>
  <text x="570" y="365" font-family="Arial, sans-serif" font-size="19" fill="#17313b">r = radius bumi</text>

  <rect x="95" y="458" width="770" height="55" rx="10" fill="#17313b"/>
  <text x="128" y="481" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#ffffff">Haversine digunakan untuk ranking awal;</text>
  <text x="128" y="503" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#ffffff">rute perjalanan ditampilkan setelah petugas dipilih.</text>
</svg>
